datasets:
  prevalence:
    columns:
      practice_code:
        - practice_code
        - practicecode
      group_code:
        - group_code
        - indicator_group
        - indicator_group_code
      register:
        - register
        - disease_register_size
        - register_size
      practice_list_size:
        - practice_list_size
        - practice_listsize
        - patient_list_size
  geography:
    columns:
      practice_code:
        - practice_code
        - practicecode
      practice_name:
        - practice_name
        - practicename
      region_ods_code:
        - region_ods_code
        - regioncode
        - region_code
      region_name:
        - region_name
        - regionname

